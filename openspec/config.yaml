schema: spec-driven

context: |
  ## Project: Repo Ledger

  A VS Code extension that reads a *directory of git repositories* and answers, in one
  glance, what state every one of them is in: what moved last, on which branch, how far
  from its upstream, and what is waiting in review.

  ## Why this exists

  Checked against primary sources on 2026-09-07, because the first version of this
  paragraph was wrong in four places and a premise a reviewer can disprove is worse than
  none. What is true: VS Code's own Repositories row already carries the branch and the
  ahead/behind figures, and so does GitLens's - neither carries the last commit, anywhere,
  and neither will sort by it. `git.repositoryScanMaxDepth` defaults to 1 and
  `git.scanRepositories` refuses an absolute path outright, so a repository two levels down,
  or in a directory nobody opened, is invisible to both. Directory-as-the-unit discovery is
  *not* unoccupied - two seven-figure extensions do exactly that walk - but they show no git
  state, and that is the gap.

  So the differentiator is narrow and checkable: the last commit on the row, the ordering by
  it, and repositories deeper than one level or never opened. The gap is real and the demand
  is unproven; nothing comparable on the Marketplace is above a few hundred installs. Do not
  restore the wider claim.

  ## The governing constraint: it is published

  It will run on layouts, hardware and networks its author will never see. Nothing may be
  assumed about how many repositories there are, how they are nested, how fast git answers,
  how many cores the machine has, whether a given repository answers at all, whether `git`,
  `gh` or `glab` are installed or authenticated, or whether every repository belongs to the
  same account and forge.

  Measurements taken on a development machine are smoke tests, never design inputs. A number
  from one machine does not become a constant, a threshold or an argument. If a measurement
  appears to justify a decision, the decision has been fitted to a single sample and is wrong.

  ## Tech Stack

  - Language: TypeScript (strict), targeting the VS Code extension host (Node)
  - UI: a webview for the repository list, because a three-line row is not a tree item;
    the history pane below it
  - Build: esbuild bundle to `dist/extension.js`, `vscode` external, no runtime dependencies
  - Lint/types: eslint + `tsc --noEmit`
  - Tests: `node --test "src/**/*.test.ts"`, plain node:test, no extension host
  - Git access: the `git` CLI via `child_process`, never a JS git reimplementation
  - Forge access: the `gh` and `glab` CLIs when present and authenticated; no tokens are
    ever asked for or stored

  ## Key Architecture Concepts

  - **The directory is the unit.** Repositories are discovered at any depth beneath the
    open folders and beneath configured absolute paths, whether or not they are open.
  - **Spawn count is the budget.** Process startup, not git's work, is what a row costs on
    every platform. So the question is always how few processes a row needs -
    `git status --porcelain=v2 --branch` earns its place by answering branch, upstream,
    divergence and dirtiness in one.
  - **Nothing blocks and nothing waits for everything.** Rows appear as each repository
    resolves. A superseded read is cancelled. A read that times out says so.
  - **An unreadable repository is a state, not an absence.** The row carries the reason and,
    where there is one, the command that fixes it. A count nobody established never renders
    as zero.
  - **Everything is a read.** No staging, committing, pushing or merging. The extension
    hands off to the tools already installed.
  - **The network is opt-in.** Merge-request counts touch the network, so they ship
    disabled, exactly as the sibling project's evidence layers do.

  ## Sibling project

  `E:\AI\openspec-ledger` is a finished, published extension by the same author. Its
  conventions are the house style and its `src/util/git.ts`, `src/util/fsx.ts`,
  `src/util/log.ts` and discovery walk are copied rather than re-derived. Code is copied,
  not shared through a monorepo: two Marketplace extensions with a shared package is a
  publishing coupling neither project needs.

rules:
  proposal:
    - State what this does that VS Code's Source Control view and GitLens do not, in the first paragraph
    - Do not quote a Marketplace install count or a competitor's feature unless it has been checked
    - Do not justify any decision with a number measured on the development machine
    - Name the capabilities that will become spec files, one bullet each
    - Include an Impact section covering spawn count, cancellation, and what touches the network
  specs:
    - Use WHEN/THEN scenarios for every requirement
    - Every requirement must be observable from outside - a row's text, a command's result, a file on disk
    - Cover the degenerate repositories explicitly - unreadable, no commits, detached HEAD, mid-rebase, no remote, bare, nested inside another
    - Cover the degenerate environments - no git on PATH, no gh or glab, an unauthenticated host, a slow or unreachable filesystem
    - A count the extension has not established must never render as zero
    - State what the row shows while an answer is still being fetched
  design:
    - Record each decision as D1, D2, ... with the alternative rejected and what goes wrong with it
    - State the spawn count for every operation that touches git, and where its concurrency comes from
    - No tuning constant may be a number from one machine; derive it or make it a setting
    - Justify webview versus TreeView for each surface rather than assuming either
    - Name which files are copied from the sibling project verbatim and which are adapted
    - Say what happens to an in-flight read when the user clicks a different repository
  tasks:
    - Break tasks into chunks of at most two hours
    - Group by capability, ordered so each group ends in something runnable or testable
    - The first group is discovery and the row read, because every surface renders their output
    - Each task independently testable, with its test task adjacent
    - The forge layer comes last and is switched off when it lands
