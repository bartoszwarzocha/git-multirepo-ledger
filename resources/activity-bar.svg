<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
  <!-- The directory, which is the unit this extension works in -->
  <path d="M2.6 20.8V4.6h6l1.7 2.3h11.1v13.9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
  <!-- A branch inside it: what the directory holds is histories, not files.
