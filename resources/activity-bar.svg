  <path d="M16 12.6v.6a2.6 2.6 0 0 1-2.6 2.6H8.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="8.6" cy="10.6" r="1.9" />
  <circle cx="8.6" cy="18.2" r="1.9" />
  <circle cx="16" cy="10.8" r="1.9" />
</svg>
